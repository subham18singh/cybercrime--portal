<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D9FF" />
      <stop offset="50%" stop-color="#367BFF" />
      <stop offset="100%" stop-color="#8B5CF6" />
    </linearGradient>
    <linearGradient id="coreGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00D9FF" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#367BFF" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>
  <!-- Outer Shield Outline -->
  <path d="M50 8 L84 22 V50 C84 72 50 92 50 92 C50 92 16 72 16 50 V22 Z" stroke="url(#shieldGrad)" stroke-width="3.5" fill="#080D1B" filter="url(#glow)"/>
  <!-- Inner Shield Circuit -->
  <path d="M50 18 L76 29 V48 C76 65 50 81 50 81 C50 81 24 65 24 48 V29 Z" stroke="#00D9FF" stroke-width="1.5" stroke-dasharray="3 3" opacity="0.6"/>
  <!-- Central AI Core Node -->
  <circle cx="50" cy="46" r="14" fill="url(#coreGlow)" stroke="#00D9FF" stroke-width="2"/>
  <circle cx="50" cy="46" r="7" fill="#00D9FF"/>
  <!-- Circuit Pathways -->
  <path d="M50 32 V24 M50 60 V72 M36 46 H28 M64 46 H72" stroke="#00D9FF" stroke-width="2" stroke-linecap="round"/>
  <circle cx="50" cy="24" r="2.5" fill="#00D9FF"/>
  <circle cx="50" cy="72" r="2.5" fill="#8B5CF6"/>
  <circle cx="28" cy="46" r="2.5" fill="#367BFF"/>
  <circle cx="72" cy="46" r="2.5" fill="#367BFF"/>
</svg>
